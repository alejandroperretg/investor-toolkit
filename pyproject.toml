[project]
name = "investor-toolkit"
version = "0.1.0"
description = "Validated quantitative tools for long-term investors: returns, risk, diversification, factors, backtesting and Monte Carlo savings projections."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alejandro Perret-Gentil", email = "alejandroperret04@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.7.22",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scipy>=1.18.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: checks a model against an analytical or reference result",
    "network: requires internet access (deselect with -m 'not network')",
]
addopts = "-m 'not network'"
